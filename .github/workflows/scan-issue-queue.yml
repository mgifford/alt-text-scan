# This workflow scans ALL open issues with titles starting with "SCAN:"
# It runs daily at midnight UTC and can also be triggered manually.
# Use this workflow to process regular scan requests submitted via the web form.
#
# Architecture: two-job design to prevent the single-job 6-hour timeout:
#   1. prepare  — fetches the issue list and marks issues as active (fast, seconds)
#   2. scan-issue — matrix job, one runner per issue, timeout-minutes: 90 each
#                   max-parallel: 1 keeps git pushes sequential; fail-fast: false
#                   lets other issues finish even when one times out or errors.

name: Scan All Open SCAN Issues

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional issue number to prioritize from the queue
        required: false
        type: string
      source:
        description: Why the queue worker was triggered
        required: false
        default: manual
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: scan-repository
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: fetch the queue and mark issues as active
  # ---------------------------------------------------------------------------
  prepare:
    name: Fetch open SCAN issues
    runs-on: ubuntu-latest
    outputs:
      issue-matrix: ${{ steps.fetch-issues.outputs.result }}

    steps:
      - name: Fetch open SCAN issues
        id: fetch-issues
        uses: actions/github-script@v8
        env:
          REQUESTED_ISSUE_NUMBER: ${{ github.event.inputs.issue_number || '' }}
        with:
          script: |
            const requestedIssueNumber = Number(process.env.REQUESTED_ISSUE_NUMBER || 0);
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const scanIssues = issues
              .filter(issue => issue.title.startsWith('SCAN:') && !issue.pull_request)
              .sort((left, right) => {
                const leftPriority = requestedIssueNumber > 0 && left.number === requestedIssueNumber ? 0 : 1;
                const rightPriority = requestedIssueNumber > 0 && right.number === requestedIssueNumber ? 0 : 1;
                if (leftPriority !== rightPriority) {
                  return leftPriority - rightPriority;
                }
                return new Date(left.created_at).getTime() - new Date(right.created_at).getTime();
              });

            const queueBatchSize = Math.min(scanIssues.length, 5);
            const queuedIssues = scanIssues.slice(0, queueBatchSize);

            console.log(`Found ${scanIssues.length} open SCAN issues, processing ${queuedIssues.length} this run`);
            return queuedIssues.map(issue => issue.number);
          result-encoding: json

      - name: Ensure required labels exist
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const required = [
              { name: 'scan-pending',  color: 'cfd3d7', description: 'Scan request is waiting in the queue' },
              { name: 'scan-blocked',  color: 'e4e669', description: 'URL discovery was blocked by the site (e.g. HTTP 403 / WAF)' },
              { name: 'scan-in-progress', color: '0075ca', description: 'Scan is currently running' },
              { name: 'scan-complete', color: '0e8a16', description: 'Scan completed successfully' },
              { name: 'scan-failed',   color: 'd93f0b', description: 'Scan encountered an error' },
            ];
            for (const label of required) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (err) {
                if (err.status !== 422) throw err; // 422 = label already exists
              }
            }

      - name: Mark queued issues as active
        if: steps.fetch-issues.outputs.result != '[]'
        uses: actions/github-script@v8
        with:
          script: |
            const issueNumbers = ${{ steps.fetch-issues.outputs.result }};

            for (const issueNumber of issueNumbers) {
              for (const name of ['scan-failed', 'scan-complete', 'scan-pending', 'scan-blocked']) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name
                  });
                } catch (error) {
                  if (error.status !== 404) {
                    throw error;
                  }
                }
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['scan-in-progress']
              });
            }

  # ---------------------------------------------------------------------------
  # Job 2: scan one issue per matrix slot
  #   - timeout-minutes: 90  → each issue gets at most 90 min before GitHub
  #                             cancels only that slot, not the whole run
  #   - max-parallel: 1      → sequential git pushes, no rebase conflicts
  #   - fail-fast: false     → a timed-out issue does not cancel the others
  # ---------------------------------------------------------------------------
  scan-issue:
    name: Scan issue #${{ matrix.issue_number }}
    needs: prepare
    if: needs.prepare.outputs.issue-matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        issue_number: ${{ fromJSON(needs.prepare.outputs.issue-matrix) }}
      max-parallel: 1
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Timeout configuration (optional, defaults shown):
      # - FETCH_TIMEOUT_MS: Maximum time for initial HTTP fetch (default: 30000ms = 30s)
      # - PER_URL_TIMEOUT_MS: Maximum time per URL including fetch and all audits (default: 60000ms = 60s)
      # - TOTAL_SCAN_TIMEOUT_MS: Maximum total scan time (default: 3000000ms = 50min)
      # - ALFA_PAGE_TIMEOUT_MS: ALFA CLI page load timeout (default: 30000ms = 30s)
      # - ALFA_COMMAND_TIMEOUT_MS: ALFA command execution timeout (default: 180000ms = 3min)
      # - PLAYWRIGHT_NAV_TIMEOUT_MS: Playwright page navigation timeout (default: 30000ms = 30s)
      # - PLAYWRIGHT_LAUNCH_TIMEOUT_MS: Playwright browser launch timeout (default: 30000ms = 30s)
      # - SITEMAP_DISCOVERY_TIMEOUT_MS: Max time to spend discovering URLs via sitemap (default: 300000ms = 5min)
      # - MAX_SITEMAP_CHILDREN: Max child sitemaps to fetch from a sitemap index (default: 50)

      - name: Scan issue
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ matrix.issue_number }}
        with:
          script: |
            const { scanIssue } = require('./.github/scripts/scan-issue.cjs');
            return await scanIssue({ github, context, core });
